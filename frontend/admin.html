<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>WaxPrint Admin Panel</title><style>
body{margin:0;background:#f5f7fa;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.adminShell{display:grid;grid-template-columns:286px minmax(0,1fr);min-height:100vh;background:#f5f7fa}
.adminSideNav{box-sizing:border-box;position:sticky;top:0;height:100vh;overflow:auto;background:linear-gradient(180deg,#071827 0%,#102b3f 100%);color:#fff;padding:18px 14px}
.adminSideBrand{display:flex;flex-direction:column;gap:12px;padding:6px 0 18px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:14px}
.adminSideBrand img{display:block;width:100%;max-width:258px;height:auto;border-radius:8px;background:#fff;box-shadow:0 12px 30px rgba(0,0,0,.22)}
.adminSideBrand b{display:block;color:#fff;font-size:15px}
.adminSideBrand small{display:block;color:#a9b8c5;font-size:11px;margin-top:3px}
.adminSideMenu,.adminSideActions{display:flex;flex-direction:column;gap:6px}
.adminSideMenu button,.adminSideActions button{display:flex;align-items:center;gap:9px;width:100%;border:1px solid transparent;border-radius:8px;background:transparent;color:#d9e3eb;padding:10px 11px;text-align:left;font-size:13px;font-weight:900;cursor:pointer}
.adminSideDataSlot{display:block}
.adminSideDataModules{display:flex;flex-direction:column;gap:4px;max-height:none;overflow:visible;margin:2px 0}
.adminSideDataModules a{display:flex;align-items:center;justify-content:space-between;gap:9px;width:100%;border:1px solid transparent;border-radius:8px;background:transparent;color:#d9e3eb;padding:8px 9px;text-align:left;cursor:pointer;text-decoration:none}
.adminSideDataModules a.active{border-color:#e94d4f;background:rgba(233,77,79,.14);color:#fff}
.adminSideDataModules span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;font-weight:900}
.adminSideDataModules a b{font-size:10px;color:#0b1f2d;background:#fff;border-radius:8px;padding:3px 7px;white-space:nowrap}
.adminStandalone{min-width:0;padding:22px clamp(14px,3vw,34px) 40px;background:#f5f7fa}
@media(max-width:1120px){.adminShell{grid-template-columns:1fr}.adminSideNav{position:relative;height:auto}.adminSideBrand img{max-width:260px}}
</style></head><body><div id="admin-root"></div><script type="module" src="/src/admin.tsx"></script></body></html>
